# The ONE production compose file. It runs in three places:
#   - Coolify (Docker Compose build pack): prod on main and every PR preview;
#   - a plain VPS without Coolify: add -f docker-compose.standalone.yml, which
#     publishes the loopback ports Coolify's Traefik makes unnecessary here;
#   - locally, to reproduce production.
# Rules that follow from Coolify running it (docs/coolify-deploy.md):
#   - no `networks:` — Coolify creates the stack network; a second network on
#     a container makes its Traefik pick interfaces non-deterministically;
#   - no `ports:` — Coolify does not strip them, and two previews would fight
#     over 127.0.0.1:8080. The standalone override adds them back;
#   - Coolify reads this file from the application's branch (`main`) on EVERY
#     deploy, previews included — a PR's edit to it reaches previews only after
#     the merge, and that PR's own preview still runs main's copy;
#   - a sibling service is addressed as ${SERVICE_NAME_<SVC>:-<svc>}, never by
#     its literal name — previews suffix every service with -pr-<N>;
#   - a key that Coolify's env sets define per environment is written
#     `KEY: ${KEY}`, never `${KEY:-default}` — Coolify's parser turns the
#     latter into the PRODUCTION value, previews included (BOOTSTRAP_OWNER_*
#     below has the full story).
#
# Memory sizing: every mem_limit and Node heap cap below is a variable with the
# current preview-sized default, so a limit is an env-set edit in Coolify, not
# a commit that has to be merged before any preview can pick it up. Production
# overrides them upward (docs/coolify-deploy.md «Environment variables»);
# previews keep the defaults. Invariant when overriding: the Node heap cap stays
# comfortably below its service's mem_limit, so an out-of-memory surfaces as a
# readable Node heap error instead of a SIGKILL from the cgroup.
#
# Distinct project name: without it, running this file from the same directory
# as the dev stack would silently reuse the dev-initialized pg_data volume
# (and its dev credentials) for production. Coolify ignores `name:` and uses
# its own resource UUID.
name: yagoda-prod

volumes:
  pg_data:
  # Uploaded images (avatars, etc.) are written under /app/uploads and served
  # as static assets. Without this volume they live inside the backend
  # container and are lost on every redeploy.
  uploads_data:
  # AOF, not just the volume. The image's default RDB policy
  # (save 3600 1 / 300 100 / 60 10000) may not snapshot for an hour on a
  # low-write instance, so rate-limit counters written minutes before a
  # restart would be lost even with /data persisted. appendfsync everysec
  # bounds that loss to ~1s.
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Default verified under migrations + seed + restore (plan Task 3 step 4).
    # The image's shared_buffers default (128MB) fits; the realistic peaks are
    # the seed's inserts and a pg_restore, not idle.
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-64m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Built and pushed by .github/workflows/ci.yml as sha-<full commit>; that
    # tag is the ONLY thing ever deployed. Coolify sets SOURCE_COMMIT to the
    # commit it checked out (see docs/coolify-deploy.md). IMAGE_TAG exists for
    # the standalone path (pass it explicitly) and for the documented API
    # fallback — never set it in Coolify's env otherwise.
    image: ghcr.io/${GHCR_REPO:-webspirio/yagoda-starter}-backend:${IMAGE_TAG:-sha-${SOURCE_COMMIT}}
    environment:
      NODE_ENV: production
      # Heap cap below mem_limit, so an out-of-memory is a readable Node heap
      # error in the logs rather than a SIGKILL from the cgroup. Raise
      # BACKEND_MEM_LIMIT first, then this.
      NODE_OPTIONS: --max-old-space-size=${BACKEND_HEAP_MB:-256}
      APP_URL: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Coolify renames every service of a PREVIEW with a `-pr-<N>` suffix
      # (postgres → postgres-pr-179) and the DNS name follows, so a hardcoded
      # `postgres` here left every preview backend on `getaddrinfo EAI_AGAIN
      # postgres` (#68). Coolify publishes each service's real name as
      # SERVICE_NAME_<SERVICE> in the deployment .env — unsuffixed in
      # production — and compose resolves it at `up` time. The default is for
      # the standalone path, where nothing sets SERVICE_NAME_*. Same for
      # REDIS_HOST, the seed's DB_HOST and nginx's BACKEND_HOST below.
      DB_HOST: ${SERVICE_NAME_POSTGRES:-postgres}
      DB_PORT: 5432
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-app}
      # Proxy hops in front of the backend: Coolify's Traefik + the internal
      # nginx (or host nginx + internal nginx on the standalone path). Rate
      # limiting keys on the client IP taken this many hops back in
      # X-Forwarded-For.
      TRUST_PROXY_HOPS: 2
      REDIS_HOST: ${SERVICE_NAME_REDIS:-redis}
      REDIS_PORT: 6379
      # Pin the uploads dir to the volume's absolute mount path. Without this the
      # backend (and any migration run) falls back to `./uploads`, which is
      # CWD-relative — a process launched with a different working directory would
      # silently read/write the wrong place (and its files would miss this volume).
      UPLOADS_DIR: /app/uploads
      # BootstrapOwner1788600000003 runs INSIDE this container as part of the
      # startup migration run (migrationsRun: true) and only ever runs once — it
      # records itself as applied on its very first invocation, whether or not it
      # actually created anyone. Compose's top-level .env only interpolates
      # `${…}` inside this file, it does NOT inject vars into the container, so
      # without listing these explicitly here BOOTSTRAP_OWNER_LOGIN/_PASSWORD are
      # undefined at boot, the migration silently no-ops, and — since public
      # registration is deleted — the install has no owner and no recovery path
      # short of hand-inserting a user row, an identity row and a hand-computed
      # scrypt hash. A missed variable here is unrecoverable, not merely
      # inconvenient, so forward these even though they may be empty
      # (config/env.schema.ts treats "" as unset).
      #
      # NO `:-` DEFAULT on any key that Coolify's env sets define per
      # environment. Coolify's compose parser rewrites `KEY: ${KEY:-x}` into a
      # LITERAL taken from the application's PRODUCTION env set — in previews
      # too — while a bare `KEY: ${KEY}` is kept as a reference that compose
      # resolves from that deployment's own .env. On 2026-09-29 the first
      # working preview therefore booted with production's owner password and
      # an empty SEED_DEV_DATA (docs/coolify-deploy.md «Environment variables
      # in Coolify»). An unset variable renders as "" here, which every one of
      # these treats as «not set», so the standalone path loses nothing.
      BOOTSTRAP_OWNER_LOGIN: ${BOOTSTRAP_OWNER_LOGIN}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD}
      BOOTSTRAP_OWNER_FIRST_NAME: ${BOOTSTRAP_OWNER_FIRST_NAME}
      BOOTSTRAP_OWNER_LAST_NAME: ${BOOTSTRAP_OWNER_LAST_NAME}
      # `:-` is tolerable ONLY where every env set holds the same value (this,
      # JWT_EXPIRES_IN, DB_USER, DB_NAME) — the production literal the parser
      # injects is then the right value everywhere — OR where the variable's
      # name differs from the key's (NODE_OPTIONS: …${BACKEND_HEAP_MB:-256},
      # DB_HOST: ${SERVICE_NAME_POSTGRES:-postgres}): the parser only rewrites
      # `KEY: ${KEY:-…}`, key and variable sharing a name.
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
      # Owner-readable passwords (issue #11). Forwarded explicitly for the same
      # reason as BOOTSTRAP_OWNER_* above — compose's .env does not reach the
      # container. Empty is a supported value and means the feature is off; a
      # key CHANGED after passwords were issued makes the existing copies
      # unreadable, so treat it as a permanent per-environment secret. No `:-`
      # for the same reason as BOOTSTRAP_OWNER_* above.
      PASSWORD_VAULT_KEY: ${PASSWORD_VAULT_KEY}
    volumes:
      - uploads_data:/app/uploads
    mem_limit: ${BACKEND_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot demo dataset for PREVIEW deployments only. Coolify's preview env
  # set carries SEED_DEV_DATA=true; production does not, so this exits 0 at
  # once there. It waits for the BACKEND, not Postgres: the seed refuses to run
  # while migrations are pending and the backend's start-up is the only
  # migration runner in the stack — a healthy backend is the signal that the
  # schema exists. Idempotent: a redeploy of the same preview inserts 0 rows.
  #
  # The seed's own NODE_ENV=production refusal does NOT guard production in
  # this topology: the command below flips NODE_ENV to development only for
  # the exec'd process, after the guard has already let it through, so that
  # refusal never fires here. Its local-host check also passes (DB_HOST is
  # `postgres`, or `postgres-pr-<N>` in a preview, which the check accepts).
  # The ONLY thing keeping demo data out of production is that SEED_DEV_DATA
  # is empty or absent in the production env set — never set it there. And it
  # is written as `${SEED_DEV_DATA}` with no `:-` on purpose: with a default,
  # Coolify's parser hardcodes the PRODUCTION set's (empty) value into every
  # preview too, and the preview seed never runs — which is exactly what
  # happened until 2026-09-29 (see BOOTSTRAP_OWNER_* in the backend above).
  seed:
    image: ghcr.io/${GHCR_REPO:-webspirio/yagoda-starter}-backend:${IMAGE_TAG:-sha-${SOURCE_COMMIT}}
    command:
      - sh
      - -c
      - '[ "$$SEED_DEV_DATA" = "true" ] || exit 0; exec env NODE_ENV=development node backend/dist/seed/dev-seed.cli.js'
    environment:
      SEED_DEV_DATA: ${SEED_DEV_DATA}
      NODE_ENV: production
      # Heap cap below mem_limit for the same reason as the backend's.
      NODE_OPTIONS: --max-old-space-size=${SEED_HEAP_MB:-192}
      DB_HOST: ${SERVICE_NAME_POSTGRES:-postgres}
      DB_PORT: 5432
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-app}
    mem_limit: ${SEED_MEM_LIMIT:-256m}
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy

  # nginx serves the SPA and proxies /api/ to the backend. It does NOT
  # terminate TLS: Coolify's Traefik (or the host nginx on the standalone
  # path, docs/vps-tls-setup.md) owns the public HTTPS listener. Both must
  # allow request bodies of at least 12 MB (uploads are capped at 10 MB).
  nginx:
    image: ghcr.io/${GHCR_REPO:-webspirio/yagoda-starter}-nginx:${IMAGE_TAG:-sha-${SOURCE_COMMIT}}
    environment:
      # nginx/default.conf.template proxies /api/ to BACKEND_HOST:3000; the
      # image renders it with envsubst at start-up (nginx/Dockerfile). In a
      # preview the backend is `backend-pr-<N>` — see DB_HOST above.
      BACKEND_HOST: ${SERVICE_NAME_BACKEND:-backend}
    # Coolify's Traefik reads the compose file, not the image metadata, to learn
    # which port to route a domain to; nginx/default.conf.template listens on 8080 and the
    # image declares no EXPOSE, so without this the generated route points at 80
    # and the domain answers 502. `expose` does not publish to the host, so the
    # «no ports:» rule above still holds.
    expose:
      - "8080"
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
