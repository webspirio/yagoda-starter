# This file is included into the http {} context via /etc/nginx/conf.d/*.conf
# (see nginx/Dockerfile), so `map` — which is only valid at http scope — can
# live here even though there's no explicit `http { ... }` wrapper in this file.
#
# Upgrade/Connection passthrough for WebSocket support: falls back to "close"
# when the client sends no Upgrade header (plain HTTP), so this is harmless
# for today's request/response-only API and only matters once the app grows
# real-time features — no rewrite needed then.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # nginxinc/nginx-unprivileged runs as non-root and can only bind unprivileged ports.
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Must exceed MEDIA_MAX_BYTES (10 MB) with headroom for multipart framing,
    # or an at-the-limit upload 413s here before reaching the app. Any TLS
    # terminator in front of this proxy needs the same allowance.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    # Security headers for ALL responses. nginx gotcha: add_header in a
    # location block REPLACES every inherited add_header, so any location
    # that sets its own header (the caching blocks below) must repeat these
    # three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Vite emits content-hashed filenames under /assets/ — cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Uploaded images are written to the backend's UPLOADS_DIR and served by
    # Nest under /uploads/. Without this block they fall through to
    # `location /` and get the SPA index.html instead of the image.
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # index.html (SPA fallback) must never be cached, or clients keep
        # loading stale hashed-asset URLs after a deploy.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
