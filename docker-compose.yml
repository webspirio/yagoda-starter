# Explicit project name keeps dev volumes/networks separate from the prod stack
# (docker-compose.prod.yml uses web-starter-prod).
name: web-starter

networks:
  app_net:

volumes:
  pg_data:
  # Mirrors prod's uploads volume so uploaded images survive container
  # recreation. `down -v` resets the DB and uploads together.
  uploads_dev:
  redis_dev:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    # Published on the LOOPBACK ONLY so host-run tooling works: pipeline.db-spec.ts
    # boots the full AppModule, whose global ThrottlerGuard needs Redis, and
    # without a host port every request in that spec 500s. Postgres is already
    # published for the same reason (host-run migration:generate) — but on
    # 0.0.0.0, whereas this stays on 127.0.0.1: nothing outside this machine has
    # any reason to reach a passwordless dev Redis.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/backend/src
      # start:dev runs node via `npm -w backend`, so its cwd is /app/backend and
      # uploads resolve to /app/backend/uploads (prod runs `node` from /app →
      # /app/uploads, mounted separately in docker-compose.prod.yml).
      - uploads_dev:/app/backend/uploads
    environment:
      NODE_ENV: development
      APP_URL: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      # index.html and public/ (favicon, static files) are served by Vite
      # straight from disk — without these two mounts a change to the title,
      # the favicon or <html lang> is baked into the image and never shows
      # in the dev stack until the image is rebuilt.
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/public:/app/frontend/public
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - app_net
