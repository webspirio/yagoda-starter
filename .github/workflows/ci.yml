name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-progress runs for the same PR branch when new commits are
# pushed. main is never cancelled (cancel-in-progress is false for push events) so
# every merge's CI run completes and reports an accurate status for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default token is read-only. The docker job raises itself to
# packages: write (it pushes to GHCR); the deploy jobs add pull-requests: write
# (sticky comment, label). Nothing else needs more than contents: read.
permissions:
  contents: read


jobs:
  # Determine whether a PR changes anything consumed by the Docker image builds.
  #
  # This job only decides whether the expensive build steps may be skipped. The
  # `docker` job itself always runs on PRs, so it remains safe as a required check.
  #
  # Detection is fail-closed:
  # - if this job succeeds and docker=false, build steps may be skipped;
  # - if this job fails/cancels/is otherwise non-successful, the docker job builds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    outputs:
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required so merge-base(BASE, HEAD) is always
          # available for the three-dot PR diff.
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Use the PR payload SHAs rather than checkout HEAD: pull_request
        # workflows normally check out GitHub's synthetic merge ref.
        #
        # Three-dot diff means "changes introduced by this PR since its merge
        # base", so unrelated changes that landed on main do not cause a build.
        #
        # --name-status -M is intentional: for renames we inspect both the old
        # and new paths. Moving/deleting something out of a Docker-relevant path
        # must still trigger a build.
        #
        # Trigger set is the audited Docker build-input surface:
        #   - backend/**          backend image inputs
        #   - frontend/**         nginx image contains the built frontend
        #   - nginx/**            nginx image/config inputs
        #   - every Dockerfile
        #   - root package manifest + lockfile
        #   - .dockerignore
        #
        #   - docker-compose*.yml  Coolify deploys the compose file FROM THE PR
        #                          BRANCH, so it is a deploy input too
        #   - .github/workflows/** a workflow change must exercise the build
        #
        # turbo.json is intentionally absent: the Dockerfiles invoke workspace
        # builds directly. The diff is PR-wide (base...head), so once a PR
        # touches anything in this set, EVERY push to it builds — a later
        # docs-only commit does not leave a stale preview behind.
        #
        # FAIL CLOSED inside the detector as well: inability to compute the diff
        # means docker=true, never a skipped image build.
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "Missing PR base/head SHA -> build (fail-closed)"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed="$(git diff --name-status -M "$BASE"..."$HEAD")"; then
            echo "git diff failed -> build (fail-closed)"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_docker_input() {
            case "$1" in
              backend/*|frontend/*|nginx/*|Dockerfile|*/Dockerfile|package.json|package-lock.json|.dockerignore|docker-compose*.yml|.github/workflows/*|.github/actions/*|scripts/ci/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          docker=false

          while IFS=$'\t' read -r status path1 path2; do
            [ -z "${status:-}" ] && continue

            # For ordinary add/modify/delete entries, path1 is the affected
            # path. For rename/copy entries, path1 is the old path and path2 is
            # the new path; either side being Docker-relevant must trigger CI.
            if [ -n "${path1:-}" ] && is_docker_input "$path1"; then
              docker=true
              break
            fi

            if [ -n "${path2:-}" ] && is_docker_input "$path2"; then
              docker=true
              break
            fi
          done <<< "$changed"

          echo "docker-relevant change: $docker"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"


  # ───────────────────────────────────────────────────────────────────────────────
  # ONE job replacing `checks` and `db-checks`. It runs `npm run verify:ci` — the
  # exact command a laptop runs (`npm run verify:full` with `--no-skip`) — because
  # that is the whole thesis of this layer: the moment CI has its own command,
  # "green there / green here" drift apart and neither means anything anymore.
  # There is deliberately no CI-only script.
  #
  # This job replaces TWO of the FOUR jobs the previous version of this file ran
  # alongside `changes` and `docker`. Where each replaced job's coverage went:
  #
  #   `checks`     -> the `lint` / `typecheck` / `test` / `build` rows (registry.mjs,
  #                   read out into the generated table in the root CLAUDE.md), plus
  #                   the shell-test line `checks` used to run directly (`bash
  #                   scripts/ci/coolify-deploy.test.sh && bash
  #                   scripts/ci/ghcr-cleanup.test.sh`) — now the `test:ci-scripts`
  #                   row (`npm run test:ci-scripts`), so the same two suites keep
  #                   running, in CI and on a laptop alike, under the exact same
  #                   command.
  #   `db-checks`  -> the `test:db` row. Its Postgres/Redis fixtures now come from
  #                   `docker compose up -d --wait postgres redis` below instead of
  #                   GitHub Actions' own `services:` block — the same ports and the
  #                   same credentials a developer's own dev stack already exposes
  #                   (docker-compose.yml's postgres/redis both publish to the exact
  #                   host/port/user/password this app's own Joi-validated env
  #                   defaults already assume — see app.module.ts's validationSchema
  #                   — so the `test:db` row needs no DB_*/REDIS_* env of its own
  #                   here at all now). `APP_URL`/`JWT_SECRET` have no such default
  #                   (Joi `required()`), so they're still spelled out below, on the
  #                   one step that needs them, same as `db-checks` used to.
  #
  # `changes` and `docker` (both below) are DELIBERATELY UNTOUCHED by this job — not
  # replaced, not deleted. Both are CD infrastructure, not verification: `docker`
  # pushes the two GHCR images tagged sha-<commit> — the ONLY tag Coolify ever
  # deploys — and `changes` decides whether that push may skip a rebuild;
  # `deploy-preview` and `deploy-prod` consume `docker`'s own `pushed` output
  # directly, and both now depend on `[verify, docker]`.
  #
  # THERE USED TO BE A `docker` REGISTRY ROW AS WELL, and it is gone as of
  # 2026-09-15: `npm run docker:build`, a plain uncached `docker build` of the same
  # two images with no push, run inside `verify:ci` below. It shared a name with the
  # job and duplicated its work. The job is the one that survives, because the
  # asymmetry is not close: the job runs in PARALLEL with this one (~60s against
  # ~4 minutes, so zero wall clock), imports a warm `type=gha` buildx cache, and has
  # to build anyway in order to push — while the row sat on the critical path,
  # uncached, and cost 64s of a 228s warm run, 28% of it, to prove something already
  # being proved beside it. The job's own header below now carries what that row
  # knew. `npm run docker:build` survives as a script for a human to run by hand.
  #
  # THE JOB'S CONDITIONAL BUILD IS WHAT MAKES THAT SAFE, and it was checked rather
  # than assumed: `changes`' trigger set is a strict SUPERSET of what the two
  # Dockerfiles actually COPY (backend/Dockerfile takes package.json,
  # package-lock.json, backend/package.json and backend/; nginx/Dockerfile takes
  # those two plus frontend/package.json, frontend/ and nginx/nginx.conf), and no
  # root tsconfig feeds either — the only `extends` in the repo is
  # backend/tsconfig.build.json pointing at its own sibling. So when this job skips
  # its build, no input to either image changed.
  #
  # See docs/superpowers/2026-09-05-foundation-slice-follow-ups.md for the required-
  # status-check rename this job's introduction still owes repository settings
  # (`checks`/`db-checks` -> `verify`; `changes`/`docker` keep their names).
  #
  # ONE CACHE HERE, NOT TWO. The Turborepo `.turbo` cache below (old `checks` job)
  # is kept, because reusing it creates NO "green there / green here" divergence:
  # `npm run lint`/`typecheck`/`build`/`coverage` are the identical commands whether
  # `.turbo` is warm or cold — the cache only changes how long they take, never
  # what runs. `docker` (the workflow job below) keeps its own separate `type=gha`
  # buildx cache exactly as it always had, and it is now the only thing in this
  # workflow that builds an image at all.

  verify:
    runs-on: ubuntu-latest
    # A full-tier, --no-skip run exercises every row in scripts/verify/registry.mjs.
    # The slowest are now `selfcheck` (node --test over the layer's own 163 tests,
    # which nothing caches, in CI or on a laptop) and `smoke` (a real browser against
    # a real Compose stack). Sized from what CI ITSELF measured, not from the laptop.
    # The first real run of this job (2026-09-15, run 34995008671) took 11m10s and
    # reported, per row: lint 17.3s, typecheck 17.9s, test:ci-scripts 6.7s,
    # selfcheck 69.7s, build 15.6s, docker 63.8s, smoke 41.7s — every one of them
    # several times its warm-laptop cost, and the `docker` row in that list no longer
    # exists (see the note above). That run was
    # RED, and instructively so: `test`, `coverage` and `test:db` each died at exactly
    # `timed out after 120.0s`, the runner's inherited per-check default, with nothing
    # actually wrong. They now carry their own `timeoutMs` in scripts/verify/registry.mjs
    # (600s for coverage, 300s for test:db).
    #
    # UPDATED 2026-09-15, TWICE. First after run 34998136933: with real budgets `test` and
    # `coverage` finished at 220.4s and 254.6s, while test:db died AGAIN at its full 480s,
    # the only red row in an otherwise green 21 — and its budget was raised to 1200s purely
    # to buy one complete reading, since nobody knew what the row cost.
    #
    # Then after run 35011857830, WHICH IS THE ONE TO READ: 20 rows, all green, 9m35s for
    # the whole job. The 1200s was chasing a bug rather than a cost — `app_test` did not
    # exist on a Compose-provided Postgres and the three suites that boot the AppModule
    # never created it, so jest hung after finishing (see backend/src/testing/db-harness.ts
    # and the row's own note in scripts/verify/registry.mjs). Fixed at the source, test:db
    # measured 28.9s and its budget is now 300s. Per row on that run: lint 16.9s, typecheck
    # 16.7s, test:ci-scripts 6.7s, selfcheck 67.3s, build 14.6s, coverage 247.2s, test:db
    # 28.9s, docker 60.6s, smoke 36.6s — with `test` not running at all, superseded by
    # `coverage`, and the turbo cache still cold on this new key lineage.
    #
    # This number must stay above the SUM of those budgets, or a genuinely hung row gets
    # killed by the job instead of reported as a clean FAILED row by the runner — which is
    # the difference between "test:db timed out after 300s" and a job log that just stops.
    # The sum is now 600 + 300 = 15 minutes rather than 40, on two counts: `test` no longer
    # runs in this job at all (`coverage` supersedes it — scripts/verify/registry.mjs, and
    # the SUPERSEDED line the runner prints), and test:db's budget is sized from a real
    # reading. 60 stays as it is rather than being cut to match: the headroom over the sum
    # is what the rows without a declared budget need, they measured ~220s together on run
    # 35011857830, and a job-level timeout is the last line of defence — it should be the
    # one number here that is never tight.
    timeout-minutes: 60

    env:
      # ─────────────────────────────────────────────────────────────────────────
      # COVERAGE FLOORS. They live HERE, in the one file that actually enforces
      # them, and NOWHERE ELSE — not in jest.config.js, not in vite.config.ts, not
      # in any baseline JSON. Both of those config files read these exact variable
      # names and default every one of them to 0 when unset (see each file's own
      # header comment), so a plain `npm run coverage` on a laptop still reports
      # the percentage but never fails on it. Only this job sets them above zero,
      # which is deliberate: a 1% wobble on someone's own machine must never be
      # able to teach them that lowering a floor is how you get back to green —
      # the only place a floor can move is this file, in a reviewed diff.
      #
      # RE-MEASURED on 2026-09-15 on the tree this branch merged 156 commits of main
      # into (the transfers/point-cash slice, cash counts, intake top-ups #61), by a
      # live `npx turbo coverage --force` — never carried over from the 2026-09-11
      # figures it replaces, and never a cached Turbo replay:
      #   backend:  79.51% statements / 61.19% branches / 78.24% functions / 82.97% lines
      #   frontend: 85.25% statements / 81.59% branches / 79.37% functions / 85.66% lines
      #
      # Each floor below is that measurement FLOORED DOWN to a whole percent, never
      # pinned to the measurement itself — a floor set at the exact number turns
      # ordinary variance (a branch added, a line moved) into a red run for no
      # behavioural reason, which is precisely what trains people to lower floors
      # without reading why.
      #
      # THE RATCHET TURNS ONE WAY. Raising a floor, as ordinary feature work adds
      # tests, is an ordinary edit; LOWERING one must be a visible diff in THIS file,
      # reviewed like any other regression. This diff moves floors in BOTH directions
      # and each direction has a reason read off the measurement, not guessed:
      #
      #   RAISED, all four frontend floors, because main's cash and transfers screens
      #   arrived with their own component tests and the real numbers went UP:
      #     STATEMENTS 82 -> 85, BRANCHES 80 -> 81, FUNCTIONS 76 -> 79, LINES 83 -> 85.
      #
      #   LOWERED, three backend floors, and this is the part to read rather than wave
      #   through: STATEMENTS 80 -> 79, FUNCTIONS 80 -> 78, LINES 83 -> 82. The single
      #   mechanism behind all three is that this `coverage` task measures the UNIT
      #   config only (backend/jest.config.js, testRegex .*\.spec\.ts$), so code
      #   covered solely by *.db-spec.ts suites against a real Postgres cannot be
      #   credited here at all. But the three floors do NOT share a cause, and an
      #   earlier version of this comment blamed all three on the same thing. Split by
      #   whether a file existed before the merge (coverage-final.json against
      #   `git ls-tree 06a38e8`), MEASURED 2026-09-15:
      #       pre-merge files, today's content : 79.34% stmts / 80.35% funcs
      #       files NEW in the merge           : 80.65% stmts / 64.79% funcs
      #   FUNCTIONS 80 -> 78 is the merge: the new slices sit at 64.79% functions
      #   (point-cash 28.57%) and pull the aggregate down by roughly 2 points.
      #   STATEMENTS 80 -> 79 and LINES 83 -> 82 are NOT: the new slices measure 80.65%
      #   statements, ABOVE both the aggregate and the 80.28% this floor was set from —
      #   they pushed statements UP. That drop is one pre-existing file growing,
      #   src/seed/dev-seed.ts (557 -> 699 lines, 19 of 239 statements covered, reached
      #   only by dev-seed.db-spec.ts). Excluding src/seed/ entirely puts backend
      #   statements at 84.86% instead of 79.52% — that file alone is the whole gap, and
      #   whether it belongs in this denominator at all is a scope decision nobody has
      #   made yet, not something to settle inside a red run.
      #   BRANCHES 61 is unchanged: the real number moved 61.60 -> 61.19, still above
      #   its floor.
      # ─────────────────────────────────────────────────────────────────────────
      COVERAGE_BACKEND_STATEMENTS: 79
      COVERAGE_BACKEND_BRANCHES: 61
      COVERAGE_BACKEND_FUNCTIONS: 78
      COVERAGE_BACKEND_LINES: 82
      COVERAGE_FRONTEND_STATEMENTS: 85
      COVERAGE_FRONTEND_BRANCHES: 81
      COVERAGE_FRONTEND_FUNCTIONS: 79
      COVERAGE_FRONTEND_LINES: 85

    steps:
      - uses: actions/checkout@v7
        with:
          # The `migrations` row's rule 4 diffs every already-existing migration
          # file against origin/main (`git diff --quiet origin/main -- <path>`) and
          # SKIPS that one rule, with a printed WARNING, if origin/main cannot be
          # resolved — see registry.mjs's `migrations` entry. A shallow checkout
          # would make that ref unreachable on every run, silently narrowing this
          # row on CI specifically; full history keeps it identical to a laptop's
          # own clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # The major comes from .nvmrc — the SAME file .claude/hooks/node.sh
          # reads before running any hook-driven check — so the hook, the laptop
          # and CI cannot silently disagree about which Node runs this layer.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Persist Turborepo's local task cache across CI runs — restored unchanged from
      # the old `checks` job (see the "ONE CACHE HERE" note above for why this one,
      # unlike `docker`'s own buildx cache, is the only cache this job owns).
      #
      # THE KEY DELIBERATELY DOES NOT NAME THE JOB. It read
      # `turbo-${{ github.job }}-...` until 2026-09-15, so renaming `checks` ->
      # `verify` invalidated every cache that existed: `restore-keys:
      # turbo-verify-<os>-` matched nothing at all, and lint/typecheck/test/build ran
      # cold on every run of this branch. Run 34998136933 measured `test` at 220.4s
      # and `coverage` at 254.6s against an empty `.turbo` — roughly eight times
      # their warm cost — while this step's own log line said `0s`, which is what a
      # total miss looks like when nobody reads it. This workflow has exactly ONE job
      # that caches `.turbo`, so the job name buys nothing in the key and costs a
      # cold lineage every time that job is renamed.
      #
      # Each commit gets an immutable cache key. On an exact-key miss, restore-keys
      # lets Actions restore the newest cache visible to this ref (including an
      # eligible cache from main), then Turborepo independently validates every task
      # by its input hash before replaying it.
      #
      # PR-created caches remain scoped by GitHub's cache visibility rules; main acts
      # as the canonical shared seed for new PRs — which also means this new lineage
      # stays cold on PRs until main's own run seeds it once.
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Load-bearing, not a convenience. The `smoke` row declares `needs:
      # ['playwright-browser', 'docker']`; under `--no-skip` a missing precondition
      # is a FAILURE, not a narrower run (see registry.mjs's PRECONDITIONS and
      # run.mjs's --no-skip handling) — so skipping this step would not skip
      # `smoke` quietly, it would turn the whole job red.
      - run: npx playwright install --with-deps chromium

      # Services come from Compose, not from this workflow's own `services:`
      # block. That is the point: CI now brings up Postgres and Redis on the exact
      # ports and with the exact credentials docker-compose.yml already publishes
      # for local dev (5432/app/app, 6379) — the same path a developer already has
      # open, not a second, CI-only definition of "a database" that could drift
      # from the first. The `postgres` and `redis` PRECONDITIONS (registry.mjs)
      # become true here for the identical reason they become true on a laptop
      # that ran this same command.
      - run: docker compose up -d --wait postgres redis

      - run: npm run verify:ci
        env:
          # Every other DB_*/REDIS_* variable the `test:db` row's app boot needs
          # already defaults (Joi, app.module.ts) to exactly what the `docker
          # compose` step above publishes, so nothing else needs stating here.
          # APP_URL and JWT_SECRET have no such default — Joi marks both
          # `required()` — and CI has no untracked root `.env` for `dotenv` to
          # load them from (db-harness.ts loads one, but only if it exists), so
          # this step spells out the same two throwaway CI fixtures `db-checks`
          # used to. Nothing outside this job ever verifies a token signed with
          # this secret.
          APP_URL: http://localhost:5173
          JWT_SECRET: changeme-ci-only-jwt-secret-0123456789abcdef

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: .verify/last-run.json
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Independent from `verify` so both run in parallel. `always()` keeps this
    # job from being skipped when `changes` fails — a skipped required check
    # would hide a broken path detector.
    needs: [changes]
    if: ${{ always() }}

    # Pushes the two images to GHCR. sha-<commit> is the ONLY tag ever
    # deployed (Coolify pulls it, docs/coolify-deploy.md); pr-<N> is a human
    # convenience alias; there is deliberately no `latest`.
    #
    # Build steps run when the PR changed a Docker/deploy input, when the
    # detector did not finish (fail-closed), or on every push to main.
    # Fork PRs have no GITHUB_TOKEN write access: they build but do not push.
    #
    # ─────────────────────────────────────────────────────────────────────────
    # THIS JOB IS ALSO THE ONLY PROOF THAT THE TWO IMAGES BUILD, as of
    # 2026-09-15, when the `docker` row was deleted from
    # scripts/verify/registry.mjs for duplicating it (the `verify` job's header
    # has the reasoning). What that row established, kept here because it is
    # true of these builds too and would otherwise be lost with it:
    #
    # A green build means BOTH multi-stage images build to completion. The
    # backend's `prod` target compiles backend/src with `nest build` inside its
    # own `build` stage — never reusing anything sitting in a host
    # backend/dist — then runs a SEPARATE `npm ci --omit=dev` and copies only
    # the compiled output across. The nginx image's default target first builds
    # the ENTIRE frontend from source in its own `frontend-builder` stage
    # (`npm run build -w frontend`, the identical `tsc -b && vite build` the
    # `build` row runs on the host, run again from scratch inside the
    # container) before copying frontend/dist onto an nginx-unprivileged base
    # together with nginx/nginx.conf. A compile error, a failing npm ci, or a
    # COPY naming a path absent from the stage it draws from fails this job.
    # AS A DATED SNAPSHOT, MEASURED 2026-09-15: 24 Dockerfile steps across four
    # stages for the backend, 12 across two for nginx; 487 MB and 93 MB per
    # `docker inspect --format '{{.Size}}'`, of which a 230 MB node:24-alpine
    # base plus a 199 MB `npm ci --omit=dev` layer is most of the backend and a
    # 90.8 MB nginx-unprivileged base is nearly all of nginx.
    #
    # AND WHAT IT DOES NOT PROVE, which matters more now that nothing else
    # looks at these images at all: that they RUN. Neither image's CMD is ever
    # executed here, so a backend that builds clean and crashes on boot (a DI
    # wiring error only Nest's own bootstrap would catch, not `nest build`), or
    # an nginx image serving a frontend that renders blank, is exactly as green
    # as a working one. Nothing starts a container, hits a port or reads a log
    # line — `smoke` is the row that does, and it builds neither image.
    # docker-compose.prod.yml, where these two and a real Postgres/Redis are
    # actually wired together with env vars, volumes and networks, is never
    # invoked or validated: a correct image plus a compose file naming the
    # wrong one is invisible here. The two are built in complete ISOLATION from
    # each other, so nginx.conf proxying /api/ to a route the backend renamed
    # is invisible too. And the `type=gha` cache below means a layer whose
    # cache key did not change is TRUSTED rather than re-executed — the
    # deleted row had the identical hole (it never passed --no-cache either),
    # only with a colder cache.
    # ─────────────────────────────────────────────────────────────────────────
    permissions:
      contents: read
      packages: write

    outputs:
      pushed: ${{ steps.meta.outputs.push }}

    env:
      BUILD: >-
        ${{ github.event_name == 'push'
          || needs.changes.result != 'success'
          || needs.changes.outputs.docker == 'true' }}

    steps:
      - id: meta
        shell: bash
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          push=false
          # Dependabot PRs build but never push — they would otherwise each hold
          # a preview slot and their token cannot write packages. Scoped to
          # pull_request on purpose: an auto-merged Dependabot PR arrives on
          # main as a push by the same actor, and suppressing the image there
          # would skip deploy-prod with no signal at all.
          dependabot=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_ACTOR" = 'dependabot[bot]' ]; then dependabot=true; fi
          if [ "$BUILD" = true ] && [ "$IS_FORK" != true ] && [ "$dependabot" != true ]; then push=true; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Cache scopes: PRs read prod's cache but write only their own, so
          # preview churn never evicts the seed main relies on.
          if [ "$GITHUB_EVENT_NAME" = push ]; then scope='main'; else scope='pr'; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          {
            echo "backend_tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}-backend:sha-$SHA"
            [ -n "$PR" ] && echo "ghcr.io/${GITHUB_REPOSITORY,,}-backend:pr-$PR"
            echo "EOF"
            echo "nginx_tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}-nginx:sha-$SHA"
            [ -n "$PR" ] && echo "ghcr.io/${GITHUB_REPOSITORY,,}-nginx:pr-$PR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "build=$BUILD push=$push scope=$scope sha=$SHA"

      - uses: actions/checkout@v7
        if: env.BUILD == 'true'
        with:
          # Build the PR HEAD, not GitHub's synthetic merge commit: the image
          # is tagged sha-<head> and Coolify checks out that same head.
          ref: ${{ steps.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@v4
        if: env.BUILD == 'true'

      - uses: docker/login-action@v4
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push) backend image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.backend_tags }}
          # Attestation manifests appear in GHCR as UNTAGGED versions, which
          # scripts/ci/ghcr-cleanup.sh deletes on sight. Adding provenance,
          # sbom or a second platform later would therefore start deleting
          # parts of live images; keep the assumption enforced, not implied.
          provenance: false
          # image.source is what links the GHCR package to this repository —
          # without it the repo's GITHUB_TOKEN is not authoritative for the
          # package, which is what makes both the first push and the weekly
          # cleanup's deletes fail with «installation not allowed».
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          build-args: |
            APP_COMMIT=${{ steps.meta.outputs.sha }}
          cache-from: |
            type=gha,scope=backend-main
            type=gha,scope=backend-${{ steps.meta.outputs.scope }}
          cache-to: type=gha,mode=max,scope=backend-${{ steps.meta.outputs.scope }}

      - name: Build (and push) nginx image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.nginx_tags }}
          # Attestation manifests appear in GHCR as UNTAGGED versions, which
          # scripts/ci/ghcr-cleanup.sh deletes on sight. Adding provenance,
          # sbom or a second platform later would therefore start deleting
          # parts of live images; keep the assumption enforced, not implied.
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: |
            type=gha,scope=nginx-main
            type=gha,scope=nginx-${{ steps.meta.outputs.scope }}
          cache-to: type=gha,mode=max,scope=nginx-${{ steps.meta.outputs.scope }}

  # ---------------------------------------------------------------------------
  # CD. The deploy jobs deploy through Coolify's API and then verify the
  # application itself (preview-note-skipped only edits a comment)
  # (scripts/ci/coolify-deploy.sh). They are gated on the repository
  # variable COOLIFY_ENABLED so the workflow is valid before the server exists.
  # ---------------------------------------------------------------------------

  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify, docker]
    # Internal PRs only (forks have no secrets), and only when an image for
    # this head was actually pushed. A preview is "the CI-passed commit": both
    # jobs must be green.
    # PREVIEWS_ENABLED is a SEPARATE gate from COOLIFY_ENABLED on purpose.
    # Previews need a Coolify GitHub App: `POST /deploy?pr=<N>` is refused with
    # «Pull request N not found for this resource» unless Coolify already knows
    # the PR, and it only ever learns that from the App's webhook. Production
    # CD needs no PR record, so it stays armed while previews are switched off;
    # without the split, every PR would carry a red job for a capability that
    # is not installed. Set this to true once issue #68 is closed.
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && needs.docker.result == 'success'
      && github.event_name == 'pull_request'
      && needs.docker.outputs.pushed == 'true'
      && vars.COOLIFY_ENABLED == 'true'
      && vars.PREVIEWS_ENABLED == 'true'
    # One preview allocation at a time across the whole repository, so the
    # cap check below cannot race another PR's deploy.
    concurrency:
      group: preview-allocation
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write # gh label create / gh pr edit --add-label use the Issues API
    env:
      # 12, recalibrated 2026-09-10 against the resized server and Coolify's
      # measured RSS (docs/coolify-deploy.md «Spike results»):
      #   7.56 total − 0.37 OS − 0.63 Coolify − ~1.0 production ≈ 5.5 GiB free;
      #   at ~0.25 GiB per preview, 12 previews use ~3.0 and leave ~2.5 GiB,
      #   comfortably past the ≥0.8–1.0 GiB the spec §1 invariant requires.
      # The repository variable PREVIEW_CAP overrides it without a commit —
      # used for recalibration and for testing the limit path.
      PREVIEW_CAP: ${{ vars.PREVIEW_CAP || 12 }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: Cap on live previews
        id: cap
        shell: bash
        run: |
          set -euo pipefail
          gh label create preview --color 0e8a16 --description "Has a live Coolify preview" --force >/dev/null
          live=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label preview --limit 100 --json number --jq 'length')
          mine=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("preview") != null')
          echo "live=$live mine=$mine cap=$PREVIEW_CAP"
          if [ "$mine" != true ] && [ "$live" -ge "$PREVIEW_CAP" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: Comment — limit reached
        if: steps.cap.outputs.blocked == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: yagoda-preview
          message: |
            **Preview not deployed — limit reached** (${{ steps.cap.outputs.live }}/${{ env.PREVIEW_CAP }} live previews).
            Close or merge an older PR with the `preview` label, then re-run this job.

      # The label is the cap's only data source, so it has to be claimed before
      # Coolify creates the stack, not after verification: a preview whose
      # /ready or seeded-login check fails is still RUNNING and still holding
      # ~0.25 GiB. Labelling afterwards let every failed deploy consume memory
      # while counting as zero, and the cap is the only enforcement of the
      # spec §1 free-memory invariant. It is deliberately NOT removed on
      # failure — «this PR has a stack on the server» stays true either way;
      # closing the PR (or dropping the label by hand) releases it.
      - name: Claim a preview slot
        if: steps.cap.outputs.blocked != 'true'
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label preview

      - name: Deploy preview
        id: deploy
        if: steps.cap.outputs.blocked != 'true'
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
          app-uuid: ${{ secrets.COOLIFY_APP_UUID }}
          base-url: ${{ env.PREVIEW_URL }}
          commit: ${{ env.HEAD_SHA }}
          pr-number: ${{ env.PR }}
          # Demo credentials from backend/src/seed/dev-seed.data.ts. They exist
          # only where the preview env set carries SEED_DEV_DATA=true — that
          # variable must never be set on production (docs/coolify-deploy.md).
          seed-username: oksana
          seed-password: operator
          # Set the PREVIEW_BASIC_AUTH secret (user:pass) if the preview routers
          # carry a basicAuth middleware; empty means no credentials are sent.
          basic-auth: ${{ secrets.PREVIEW_BASIC_AUTH }}

      - name: Comment — ready
        if: steps.cap.outputs.blocked != 'true' && success()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: yagoda-preview
          message: |
            **Preview ready:** ${{ env.PREVIEW_URL }}
            Serving `sha-${{ env.HEAD_SHA }}` · sign in as `oksana` / `operator` (seed) · removed when this PR closes.

      - name: Comment — failed
        if: steps.cap.outputs.blocked != 'true' && failure()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: yagoda-preview
          message: |
            **Preview deploy failed** for `sha-${{ env.HEAD_SHA }}` — see the `deploy-preview` job log.
            ${{ env.PREVIEW_URL }} may be serving an older commit.


  preview-note-skipped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [docker]
    # The PR already had a preview (label) but this push changed nothing
    # deployable: say so instead of leaving a comment that implies the head is live.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.docker.outputs.pushed == 'false'
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && vars.COOLIFY_ENABLED == 'true'
      && vars.PREVIEWS_ENABLED == 'true'
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: yagoda-preview
          message: |
            **Preview unchanged:** this push (`${{ github.event.pull_request.head.sha }}`) touched no deployable path, so
            https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }} still serves the previous deployed commit.


  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify, docker]
    # `!cancelled()` is load-bearing, not decoration. A skip propagates DOWN the
    # needs graph transitively: `changes` skips itself on push, `docker` survives
    # only via `always()`, and every job downstream of it then inherits that skip
    # unless its own `if` contains a status function. Without this the gate
    # evaluated true — event=push, ref=refs/heads/main, docker.result=success,
    # COOLIFY_ENABLED=true, all printed by a debug job standing beside it — and
    # the job was skipped anyway, so a merge to main reported success while
    # production stayed on the previous commit. The needs' results are therefore
    # asserted explicitly, since `!cancelled()` no longer implies they passed.
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && needs.docker.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.COOLIFY_ENABLED == 'true'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # `concurrency` serialises prod deploys but does not order them, and this
      # repo merges stacked PRs forward in quick succession. Without this guard
      # a slower run for an older commit deploys AFTER the newer one and puts
      # production behind main — while staying green, because its own
      # /api/health/version assertion compares against its own SHA.
      - name: Skip if main has moved on
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $tip, not $GITHUB_SHA — its own deploy run owns production; skipping."
          fi

      - uses: ./.github/actions/coolify-deploy
        if: steps.tip.outputs.superseded != 'true'
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
          app-uuid: ${{ secrets.COOLIFY_APP_UUID }}
          base-url: ${{ vars.PROD_URL }}
          commit: ${{ github.sha }}
