name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-progress runs for the same PR branch when new commits are
# pushed. main is never cancelled (cancel-in-progress is false for push events) so
# every merge's CI run completes and reports an accurate status for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI never pushes, comments, or writes packages (the registry row's `docker:build`
# never pushes an image either), so the job token is dropped to read-only. CD sets
# its own job-scoped permissions.
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────────
  # ONE job. It runs `npm run verify:ci` — the exact command a laptop runs (`npm run
  # verify:full` with `--no-skip`) — because that is the whole thesis of this layer:
  # the moment CI has its own command, "green there / green here" drift apart and
  # neither means anything anymore. There is deliberately no CI-only script.
  #
  # This job replaces FOUR jobs the previous version of this file ran. Where each
  # one's coverage went:
  #
  #   `checks`     -> the `lint` / `typecheck` / `test` / `build` rows (registry.mjs,
  #                   read out into the generated table in the root CLAUDE.md).
  #   `db-checks`  -> the `test:db` row. Its Postgres/Redis fixtures now come from
  #                   `docker compose up -d --wait postgres redis` below instead of
  #                   GitHub Actions' own `services:` block — the same ports and the
  #                   same credentials a developer's own dev stack already exposes
  #                   (docker-compose.yml's postgres/redis both publish to the exact
  #                   host/port/user/password this app's own Joi-validated env
  #                   defaults already assume — see app.module.ts's validationSchema
  #                   — so the `test:db` row needs no DB_*/REDIS_* env of its own
  #                   here at all now). `APP_URL`/`JWT_SECRET` have no such default
  #                   (Joi `required()`), so they're still spelled out below, on the
  #                   one step that needs them, same as `db-checks` used to.
  #   `docker`     -> the `docker` row (`npm run docker:build`, needs: docker).
  #   `changes`    -> DELETED DELIBERATELY. Every PR now builds both images, every
  #                   time. What that costs: `changes` fed a Docker path filter into
  #                   `docker`'s old `docker/build-push-action` steps, which carried a
  #                   `type=gha` layer cache — a plain `docker build` (what the
  #                   `docker` registry row runs, so a laptop can run the identical
  #                   command) has no such cache, so an unchanged Dockerfile now
  #                   rebuilds from scratch on every PR instead of replaying a cached
  #                   layer. Accepted because a CI-only buildx invocation, gated by a
  #                   CI-only path filter, is exactly the kind of divergence this PR
  #                   exists to remove: this layer's central thesis is that CI runs
  #                   the same command a laptop runs, full stop.
  #
  # See docs/superpowers/2026-09-05-foundation-slice-follow-ups.md for the required-
  # status-check rename this deletion still owes repository settings.
  #
  # TWO CACHES, TWO DIFFERENT VERDICTS — worth reading side by side so the next person
  # does not wonder why one survived this rebuild and the other did not:
  #
  #   - The Docker `type=gha` buildx cache (old `docker` job) was given up on purpose.
  #     Keeping it meant CI running `docker/build-push-action` while a laptop runs the
  #     registry row's plain `docker build` — two different commands building the same
  #     images, which is exactly the "green there / green here" divergence this whole
  #     layer exists to remove. The cost is real and accepted: an unchanged Dockerfile
  #     now rebuilds from scratch on every PR (see `changes` above).
  #
  #   - The Turborepo `.turbo` cache (old `checks` job, restored below) is kept, because
  #     it creates NO such divergence. `npm run lint`/`typecheck`/`test`/`build` are the
  #     identical commands whether `.turbo` is warm or cold — the cache only changes how
  #     long they take, never what runs. The reasoning that justified dropping the
  #     Docker cache does not apply here, so there is nothing to give up.

  verify:
    runs-on: ubuntu-latest
    # A full-tier, --no-skip run exercises every row in scripts/verify/registry.mjs,
    # including the two slowest (`docker` builds two images from scratch with no
    # cache — see the `changes` note above — and `smoke` drives a real browser
    # against a real Compose stack). Sized with real headroom above the ~3-4 minute
    # local run this task measured (see task-20-report.md), for a colder, shared CI
    # runner plus `npm ci`/`playwright install` network time.
    timeout-minutes: 30

    env:
      # ─────────────────────────────────────────────────────────────────────────
      # COVERAGE FLOORS. They live HERE, in the one file that actually enforces
      # them, and NOWHERE ELSE — not in jest.config.js, not in vite.config.ts, not
      # in any baseline JSON. Both of those config files read these exact variable
      # names and default every one of them to 0 when unset (see each file's own
      # header comment), so a plain `npm run coverage` on a laptop still reports
      # the percentage but never fails on it. Only this job sets them above zero,
      # which is deliberate: a 1% wobble on someone's own machine must never be
      # able to teach them that lowering a floor is how you get back to green —
      # the only place a floor can move is this file, in a reviewed diff.
      #
      # MEASURED on 2026-09-10 (a live `npm run coverage -w backend` / `-w
      # frontend` on this exact commit, not carried over from an earlier task's
      # own measurement — see task-20-report.md for the full runs):
      #   backend:  80.45% statements / 61.95% branches / 80.83% functions / 84.13% lines
      #   frontend: 82.94% statements / 80.65% branches / 76.14% functions / 83.29% lines
      #
      # Each floor below is that measurement FLOORED DOWN to a whole percent, never
      # pinned to the measurement itself — a floor set at the exact number turns
      # ordinary variance (a branch added, a line moved) into a red run for no
      # behavioural reason, which is precisely what trains people to lower floors
      # without reading why.
      #
      # THE RATCHET TURNS ONE WAY. Raising a floor, as ordinary feature work adds
      # tests, is an ordinary edit. LOWERING one must be a visible diff in THIS
      # file, reviewed like any other regression — never a side effect of a
      # refactor, and never automated.
      # ─────────────────────────────────────────────────────────────────────────
      COVERAGE_BACKEND_STATEMENTS: 80
      COVERAGE_BACKEND_BRANCHES: 61
      COVERAGE_BACKEND_FUNCTIONS: 80
      COVERAGE_BACKEND_LINES: 84
      COVERAGE_FRONTEND_STATEMENTS: 82
      COVERAGE_FRONTEND_BRANCHES: 80
      COVERAGE_FRONTEND_FUNCTIONS: 76
      COVERAGE_FRONTEND_LINES: 83

    steps:
      - uses: actions/checkout@v7
        with:
          # The `migrations` row's rule 4 diffs every already-existing migration
          # file against origin/main (`git diff --quiet origin/main -- <path>`) and
          # SKIPS that one rule, with a printed WARNING, if origin/main cannot be
          # resolved — see registry.mjs's `migrations` entry. A shallow checkout
          # would make that ref unreachable on every run, silently narrowing this
          # row on CI specifically; full history keeps it identical to a laptop's
          # own clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # The major comes from .nvmrc — the SAME file .claude/hooks/node.sh
          # reads before running any hook-driven check — so the hook, the laptop
          # and CI cannot silently disagree about which Node runs this layer.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Persist Turborepo's local task cache across CI runs — restored unchanged from
      # the old `checks` job (see the two-caches note above for why this one, unlike
      # the Docker buildx cache, survives). `${{ github.job }}` is now `verify` rather
      # than `checks`, which simply starts a fresh cache lineage under the new job
      # name; nothing else about the key needs to change.
      #
      # Each commit gets an immutable cache key. On an exact-key miss, restore-keys
      # lets Actions restore the newest cache visible to this ref (including an
      # eligible cache from main), then Turborepo independently validates every task
      # by its input hash before replaying it.
      #
      # PR-created caches remain scoped by GitHub's cache visibility rules; main acts
      # as the canonical shared seed for new PRs.
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-

      # Load-bearing, not a convenience. The `smoke` row declares `needs:
      # ['playwright-browser', 'docker']`; under `--no-skip` a missing precondition
      # is a FAILURE, not a narrower run (see registry.mjs's PRECONDITIONS and
      # run.mjs's --no-skip handling) — so skipping this step would not skip
      # `smoke` quietly, it would turn the whole job red.
      - run: npx playwright install --with-deps chromium

      # Services come from Compose, not from this workflow's own `services:`
      # block. That is the point: CI now brings up Postgres and Redis on the exact
      # ports and with the exact credentials docker-compose.yml already publishes
      # for local dev (5432/app/app, 6379) — the same path a developer already has
      # open, not a second, CI-only definition of "a database" that could drift
      # from the first. The `postgres` and `redis` PRECONDITIONS (registry.mjs)
      # become true here for the identical reason they become true on a laptop
      # that ran this same command.
      - run: docker compose up -d --wait postgres redis

      - run: npm run verify:ci
        env:
          # Every other DB_*/REDIS_* variable the `test:db` row's app boot needs
          # already defaults (Joi, app.module.ts) to exactly what the `docker
          # compose` step above publishes, so nothing else needs stating here.
          # APP_URL and JWT_SECRET have no such default — Joi marks both
          # `required()` — and CI has no untracked root `.env` for `dotenv` to
          # load them from (db-harness.ts loads one, but only if it exists), so
          # this step spells out the same two throwaway CI fixtures `db-checks`
          # used to. Nothing outside this job ever verifies a token signed with
          # this secret.
          APP_URL: http://localhost:5173
          JWT_SECRET: changeme-ci-only-jwt-secret-0123456789abcdef

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: .verify/last-run.json
          if-no-files-found: warn
