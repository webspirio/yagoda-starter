name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-progress runs for the same PR branch when new commits are
# pushed. main is never cancelled (cancel-in-progress is false for push events) so
# every merge's CI run completes and reports an accurate status for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default token is read-only. The docker job raises itself to
# packages: write (it pushes to GHCR); the deploy jobs add pull-requests: write
# (sticky comment, label). Nothing else needs more than contents: read.
permissions:
  contents: read

jobs:
  # Determine whether a PR changes anything consumed by the Docker image builds.
  #
  # This job only decides whether the expensive build steps may be skipped. The
  # `docker` job itself always runs on PRs, so it remains safe as a required check.
  #
  # Detection is fail-closed:
  # - if this job succeeds and docker=false, build steps may be skipped;
  # - if this job fails/cancels/is otherwise non-successful, the docker job builds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    outputs:
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required so merge-base(BASE, HEAD) is always
          # available for the three-dot PR diff.
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Use the PR payload SHAs rather than checkout HEAD: pull_request
        # workflows normally check out GitHub's synthetic merge ref.
        #
        # Three-dot diff means "changes introduced by this PR since its merge
        # base", so unrelated changes that landed on main do not cause a build.
        #
        # --name-status -M is intentional: for renames we inspect both the old
        # and new paths. Moving/deleting something out of a Docker-relevant path
        # must still trigger a build.
        #
        # Trigger set is the audited Docker build-input surface:
        #   - backend/**          backend image inputs
        #   - frontend/**         nginx image contains the built frontend
        #   - nginx/**            nginx image/config inputs
        #   - every Dockerfile
        #   - root package manifest + lockfile
        #   - .dockerignore
        #
        #   - docker-compose*.yml  Coolify deploys the compose file FROM THE PR
        #                          BRANCH, so it is a deploy input too
        #   - .github/workflows/** a workflow change must exercise the build
        #
        # turbo.json is intentionally absent: the Dockerfiles invoke workspace
        # builds directly. The diff is PR-wide (base...head), so once a PR
        # touches anything in this set, EVERY push to it builds — a later
        # docs-only commit does not leave a stale preview behind.
        #
        # FAIL CLOSED inside the detector as well: inability to compute the diff
        # means docker=true, never a skipped image build.
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "Missing PR base/head SHA -> build (fail-closed)"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed="$(git diff --name-status -M "$BASE"..."$HEAD")"; then
            echo "git diff failed -> build (fail-closed)"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_docker_input() {
            case "$1" in
              backend/*|frontend/*|nginx/*|Dockerfile|*/Dockerfile|package.json|package-lock.json|.dockerignore|docker-compose*.yml|.github/workflows/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          docker=false

          while IFS=$'\t' read -r status path1 path2; do
            [ -z "${status:-}" ] && continue

            # For ordinary add/modify/delete entries, path1 is the affected
            # path. For rename/copy entries, path1 is the old path and path2 is
            # the new path; either side being Docker-relevant must trigger CI.
            if [ -n "${path1:-}" ] && is_docker_input "$path1"; then
              docker=true
              break
            fi

            if [ -n "${path2:-}" ] && is_docker_input "$path2"; then
              docker=true
              break
            fi
          done <<< "$changed"

          echo "docker-relevant change: $docker"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Persist Turborepo's local task cache across CI runs.
      #
      # Each commit gets an immutable cache key. On an exact-key miss,
      # restore-keys lets Actions restore the newest cache visible to this ref
      # (including an eligible cache from main), then Turborepo independently
      # validates every task by its input hash before replaying it.
      #
      # PR-created caches remain scoped by GitHub's cache visibility rules;
      # main acts as the canonical shared seed for new PRs.
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-

      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The deploy/cleanup scripts are bash + jq; their suites live outside npm.
      - run: bash scripts/ci/coolify-deploy.test.sh && bash scripts/ci/ghcr-cleanup.test.sh

  db-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The engine's guarantees are Postgres semantics — FOR UPDATE SKIP LOCKED,
    # UNIQUE NULLS NOT DISTINCT, CHECK — which no mocked spec can verify.
    # This job runs the handful of *.db-spec.ts suites requiring a real DB.
    #
    # It invokes Jest directly rather than through Turborepo, so it is
    # intentionally not covered by the .turbo cache.
    #
    # Redis is here for ONE suite: testing/pipeline.db-spec.ts boots the whole
    # AppModule, and its global ThrottlerGuard counts every request through
    # ThrottlerStorageRedisService. Without a reachable Redis the guard rejects
    # and each request 500s, so the pipeline spec needs the same backing
    # services the app does — not only Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Backend-only job: install just the backend workspace and avoid pulling
      # frontend-only React/Vite/etc. dependencies into this job.
      - run: npm ci --workspace=backend

      # Developers get these from the untracked root .env, which db-harness.ts
      # loads; CI has no .env, so the job spells out the same variables. APP_URL
      # and JWT_SECRET are Joi-`required()` in AppModule and so are load-bearing
      # for pipeline.db-spec.ts alone — the other suites open a bare DataSource
      # and never run that validation. Both values are throwaway CI fixtures:
      # nothing outside this job ever verifies a token signed with this secret.
      - run: npm run test:db -w backend
        env:
          APP_URL: http://localhost:5173
          JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: app
          DB_PASSWORD: app
          TEST_DB_NAME: app_test
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Independent from `checks` so both run in parallel. `always()` keeps this
    # job from being skipped when `changes` fails — a skipped required check
    # would hide a broken path detector.
    needs: [changes]
    if: ${{ always() }}

    # Pushes the two images to GHCR. sha-<commit> is the ONLY tag ever
    # deployed (Coolify pulls it, docs/coolify-deploy.md); pr-<N> is a human
    # convenience alias; there is deliberately no `latest`.
    #
    # Build steps run when the PR changed a Docker/deploy input, when the
    # detector did not finish (fail-closed), or on every push to main.
    # Fork PRs have no GITHUB_TOKEN write access: they build but do not push.
    permissions:
      contents: read
      packages: write

    outputs:
      pushed: ${{ steps.meta.outputs.push }}

    env:
      BUILD: >-
        ${{ github.event_name == 'push'
          || needs.changes.result != 'success'
          || needs.changes.outputs.docker == 'true' }}

    steps:
      - id: meta
        shell: bash
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          push=false
          # Dependabot PRs build but never push — they would otherwise each hold
          # a preview slot and their token cannot write packages.
          if [ "$BUILD" = true ] && [ "$IS_FORK" != true ] && [ "$GITHUB_ACTOR" != 'dependabot[bot]' ]; then push=true; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Cache scopes: PRs read prod's cache but write only their own, so
          # preview churn never evicts the seed main relies on.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "scope=main" >> "$GITHUB_OUTPUT"
          else
            echo "scope=pr" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "backend_tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}-backend:sha-$SHA"
            [ -n "$PR" ] && echo "ghcr.io/${GITHUB_REPOSITORY,,}-backend:pr-$PR"
            echo "EOF"
            echo "nginx_tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}-nginx:sha-$SHA"
            [ -n "$PR" ] && echo "ghcr.io/${GITHUB_REPOSITORY,,}-nginx:pr-$PR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "build=$BUILD push=$push scope=$(grep -o 'scope=.*' "$GITHUB_OUTPUT" | tail -1) sha=$SHA"

      - uses: actions/checkout@v7
        if: env.BUILD == 'true'
        with:
          # Build the PR HEAD, not GitHub's synthetic merge commit: the image
          # is tagged sha-<head> and Coolify checks out that same head.
          ref: ${{ steps.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@v4
        if: env.BUILD == 'true'

      - uses: docker/login-action@v4
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push) backend image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.backend_tags }}
          build-args: |
            APP_COMMIT=${{ steps.meta.outputs.sha }}
          cache-from: |
            type=gha,scope=backend-main
            type=gha,scope=backend-${{ steps.meta.outputs.scope }}
          cache-to: type=gha,mode=max,scope=backend-${{ steps.meta.outputs.scope }}

      - name: Build (and push) nginx image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.nginx_tags }}
          cache-from: |
            type=gha,scope=nginx-main
            type=gha,scope=nginx-${{ steps.meta.outputs.scope }}
          cache-to: type=gha,mode=max,scope=nginx-${{ steps.meta.outputs.scope }}

  # ---------------------------------------------------------------------------
  # CD. The deploy jobs deploy through Coolify's API and then verify the
  # application itself (preview-note-skipped only edits a comment)
  # (scripts/ci/coolify-deploy.sh). They are gated on the repository
  # variable COOLIFY_ENABLED so the workflow is valid before the server exists.
  # ---------------------------------------------------------------------------

  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [checks, db-checks, docker]
    # Internal PRs only (forks have no secrets), and only when an image for
    # this head was actually pushed. A preview is "the CI-passed commit": all
    # three jobs must be green.
    if: >-
      github.event_name == 'pull_request'
      && needs.docker.outputs.pushed == 'true'
      && vars.COOLIFY_ENABLED == 'true'
    # One preview allocation at a time across the whole repository, so the
    # cap check below cannot race another PR's deploy.
    concurrency:
      group: preview-allocation
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write # gh label create / gh pr edit --add-label use the Issues API
    env:
      # Provisional 6 (spec §1): recalibrated after Coolify's RSS is measured.
      # The repository variable PREVIEW_CAP overrides it without a commit —
      # used for recalibration and for testing the limit path.
      PREVIEW_CAP: ${{ vars.PREVIEW_CAP || 6 }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: Cap on live previews
        id: cap
        shell: bash
        run: |
          set -euo pipefail
          gh label create preview --color 0e8a16 --description "Has a live Coolify preview" --force >/dev/null
          live=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label preview --limit 100 --json number --jq 'length')
          mine=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("preview") != null')
          echo "live=$live mine=$mine cap=$PREVIEW_CAP"
          if [ "$mine" != true ] && [ "$live" -ge "$PREVIEW_CAP" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: Comment — limit reached
        if: steps.cap.outputs.blocked == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: yagoda-preview
          message: |
            **Preview not deployed — limit reached** (${{ steps.cap.outputs.live }}/${{ env.PREVIEW_CAP }} live previews).
            Close or merge an older PR with the `preview` label, then re-run this job.

      - name: Deploy preview
        id: deploy
        if: steps.cap.outputs.blocked != 'true'
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
          app-uuid: ${{ secrets.COOLIFY_APP_UUID }}
          base-url: ${{ env.PREVIEW_URL }}
          commit: ${{ env.HEAD_SHA }}
          pr-number: ${{ env.PR }}
          # Demo credentials from backend/src/seed/dev-seed.data.ts. They exist
          # only where the preview env set carries SEED_DEV_DATA=true — that
          # variable must never be set on production (docs/coolify-deploy.md).
          seed-username: oksana
          seed-password: operator

      - name: Comment — ready
        if: steps.cap.outputs.blocked != 'true' && success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: yagoda-preview
          message: |
            **Preview ready:** ${{ env.PREVIEW_URL }}
            Serving `sha-${{ env.HEAD_SHA }}` · sign in as `oksana` / `operator` (seed) · removed when this PR closes.

      - name: Label
        if: steps.cap.outputs.blocked != 'true' && success()
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label preview

      - name: Comment — failed
        if: steps.cap.outputs.blocked != 'true' && failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: yagoda-preview
          message: |
            **Preview deploy failed** for `sha-${{ env.HEAD_SHA }}` — see the `deploy-preview` job log.
            ${{ env.PREVIEW_URL }} may be serving an older commit.

  preview-note-skipped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [docker]
    # The PR already had a preview (label) but this push changed nothing
    # deployable: say so instead of leaving a comment that implies the head is live.
    if: >-
      github.event_name == 'pull_request'
      && needs.docker.outputs.pushed == 'false'
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && vars.COOLIFY_ENABLED == 'true'
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: yagoda-preview
          message: |
            **Preview unchanged:** this push (`${{ github.event.pull_request.head.sha }}`) touched no deployable path, so
            https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }} still serves the previous deployed commit.

  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [checks, db-checks, docker]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.docker.outputs.pushed == 'true'
      && vars.COOLIFY_ENABLED == 'true'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
          app-uuid: ${{ secrets.COOLIFY_APP_UUID }}
          base-url: ${{ vars.PROD_URL }}
          commit: ${{ github.sha }}
