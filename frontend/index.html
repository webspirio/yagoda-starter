<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ягода</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Browser chrome tint follows the app's two grounds: paper in light, the dark paper in dark. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eceee8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181819" />
    <script>
      // Pre-hydration theme seed: apply an EXPLICIT light/dark override before
      // the app bundle loads so paint 0 isn't the wrong colour. 'system' /
      // absent is left to the media-query-driven useAppTheme at runtime.
      try {
        var t = localStorage.getItem('web-starter:theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
